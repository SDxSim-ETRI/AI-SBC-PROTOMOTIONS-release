# 단계 E — 걷기 루프 3종 동시 학습 (2026-09-02)
#
# 왜 3개인가
#   단계 A~D 는 walk_cmu_02_01(1.19 m/s) 단일 모션으로 학습했다. 최종 S1 을
#   미학습 모션으로 평가하니 넘어지지는 않았으나(12/12 success_rate 1.000,
#   failure_rate 0.000) 추종 오차가 2~3배로 커졌다:
#     gt_error   02_01 0.020~0.031 → 103_07 0.043~0.080 / 39_03 0.049~0.056 m
#   추종 정확도를 사양으로 걸려면 모션 다양성이 필요하다.
#
# 왜 이 3개인가
#   같은 loop1200 계열(30 fps · 1200스텝 · 프레임별 수직 접지 보정 완료)이라
#   전처리가 동일하다. 07_04 는 간섭이 있어 제외한다(사용자 지시 2026-09-02).
#
# 가중치는 균등하다. 평가에서 **속도가 아니라 보행 양식이 지배적**으로 나타났으므로
# (103_07 +7% 가 39_03 +27% 보다 오차가 컸다) 특정 속도에 가중할 근거가 없다.
#
# 경로는 이 yaml 이 있는 폴더 기준 상대경로다
# (motion_lib.py:_fetch_motion_files → os.path.join(dirname(yaml), entry.file)).
motions:
  - file: walk_cmu_02_01_loop1200.motion    # 1.19 m/s — A~D 학습 모션
    weight: 1.0
  - file: walk_cmu_103_07_loop1200.motion   # 1.28 m/s (+7%)  — 원본 60 fps
    weight: 1.0
  - file: walk_cmu_39_03_loop1200.motion    # 1.52 m/s (+27%) — 가장 빠름
    weight: 1.0
